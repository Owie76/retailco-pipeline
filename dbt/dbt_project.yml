name: 'retailco'
version: '1.0.0'
config-version: 2

profile: 'retailco'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  retailco:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      dimensions:
        +schema: marts
      facts:
        +schema: marts

snapshots:
  retailco:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at