version: 2

models:
  - name: fct_sales
    description: "Transactional fact table - one row per order line"
    columns:
      - name: sales_key
        tests:
          - not_null
          - unique
      - name: date_key
        tests:
          - not_null
      - name: customer_key
        tests:
          - not_null
      - name: product_key
        tests:
          - not_null
      - name: store_key
        tests:
          - not_null
      - name: gross_amount
        tests:
          - not_null

  - name: fct_payments
    description: "Transactional fact table - one row per payment event"
    columns:
      - name: payment_key
        tests:
          - not_null
          - unique
      - name: date_key
        tests:
          - not_null
      - name: customer_key
        tests:
          - not_null
      - name: store_key
        tests:
          - not_null
      - name: amount_paid
        tests:
          - not_null

  - name: fct_inventory_daily
    description: "Periodic snapshot - one row per product x store x day"
    columns:
      - name: inventory_key
        tests:
          - not_null
          - unique
      - name: date_key
        tests:
          - not_null
      - name: product_key
        tests:
          - not_null
      - name: store_key
        tests:
          - not_null

  - name: fct_order_lifecycle
    description: "Accumulating snapshot - one row per order"
    columns:
      - name: lifecycle_key
        tests:
          - not_null
          - unique
      - name: ordered_date_key
        tests:
          - not_null
      - name: customer_key
        tests:
          - not_null
      - name: store_key
        tests:
          - not_null
      - name: current_status
        tests:
          - not_null
          - accepted_values:
              values: ['pending', 'paid', 'shipped', 'delivered']

  - name: flagged_payments
    description: "Data quality table - anomalous payments excluded from fct_payments"
    columns:
      - name: flagged_payment_key
        tests:
          - not_null
          - unique
      - name: flag_reason
        tests:
          - not_null