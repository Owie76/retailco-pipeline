version: 2

models:

  - name: dim_store
    description: "Store dimension with surrogate keys"
    columns:
      - name: store_key
        tests:
          - not_null
          - unique
      - name: store_id
        tests:
          - not_null

  - name: dim_employee
    description: "Employee dimension with surrogate keys"
    columns:
      - name: employee_key
        tests:
          - not_null
          - unique
      - name: store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_key

  - name: dim_payment_method
    description: "Payment method dimension with surrogate keys"
    columns:
      - name: payment_method_key
        tests:
          - not_null
          - unique

  - name: dim_customer
    description: "Customer dimension with SCD2 history"
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null

  - name: dim_product
    description: "Product dimension with SCD2 history"
    columns:
      - name: product_key
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null